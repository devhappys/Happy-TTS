name: Node Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-verify:
    name: Node verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 混淆产物冒烟要真正启动一次后端，而 MONGO_URI 是启动硬依赖（config.ts 无 URI 直接拒绝解析）。
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        # 跳过依赖安装脚本，避免未批准的本地构建
        # （bcrypt / @scarf/scarf / unrs-resolver 等）导致安装阶段退出。
        run: pnpm install --ignore-scripts

      - name: Audit policy static checks
        run: pnpm run check:audit-policies

      - name: Run build
        run: pnpm run build

      - name: Generate OpenAPI spec (validate swagger-jsdoc annotations)
        # openapi.json 被 .gitignore 忽略，产物不入库；在镜像构建前暴露 swagger-jsdoc 语法错误。
        run: pnpm run generate:openapi

      - name: OpenAPI drift gate (documented paths vs generated spec)
        # swagger-jsdoc 丢弃解析失败的注释块时不报错，端点会静默从 spec 里消失。
        run: pnpm run check:openapi-drift

      - name: Obfuscated artifact smoke (production boot of dist-obfuscated)
        # 生产镜像跑的是 dist-obfuscated；混淆破坏与生产模式启动断言只在运行时暴露。
        env:
          SMOKE_MONGO_URI: mongodb://127.0.0.1:27017/synapse_smoke
        run: pnpm run smoke:obfuscated

      - name: Tree-shaking config drift (advisory)
        # scripts/check-tree-shaking.js 只报告、从不失败：这里是可见性，不是门禁。
        run: pnpm run check:tree-shaking-config

      - name: Run backend Jest tests with coverage
        id: backend-tests
        continue-on-error: true
        run: pnpm run test:ci

      - name: Run frontend Vitest tests with coverage
        id: frontend-tests
        continue-on-error: true
        run: pnpm --dir frontend run test:ci

      - name: Report test step outcomes (known degraded)
        if: always()
        run: |
          {
            echo "## Test step outcomes"
            echo ""
            echo "- Backend Jest (\`backend-tests\`): \`${{ steps.backend-tests.outcome }}\`"
            echo "- Frontend Vitest (\`frontend-tests\`): \`${{ steps.frontend-tests.outcome }}\`"
            echo ""
            echo "> 这两个测试步骤当前处于**已知失败状态**（后端：ts-jest 与 typescript@7 不兼容；前端：缺 @vitest/coverage-istanbul），"
            echo "> 结果**未参与门禁**（continue-on-error）。恢复方案见审查报告 G13-01 / G13-02；在恢复之前，"
            echo "> 本 job 的绿色不代表任何单元测试真实通过。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synapse-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/
            dist-obfuscated/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Check for path-to-regexp issues
        run: |
          echo "Checking for potential path-to-regexp issues..."
          if grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"; then
            echo "Found routes with hyphens that might cause path-to-regexp issues:"
            grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"
            echo "Consider replacing hyphens with slashes in route paths"
          else
            echo "No routes with hyphens found"
          fi

  type-check-backend:
    name: type-check-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: TypeScript check backend
        run: npx tsc --noEmit --project tsconfig.json

  type-check-frontend:
    name: type-check-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: TypeScript check frontend
        run: pnpm --dir frontend run typecheck

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    needs: [type-check-backend, type-check-frontend]
    if: always()
    steps:
      - name: Check type-check-backend result
        if: needs.type-check-backend.result != 'success'
        run: |
          echo "type-check-backend result: ${{ needs.type-check-backend.result }}"
          exit 1

      - name: Check type-check-frontend result
        if: needs.type-check-frontend.result != 'success'
        run: |
          echo "type-check-frontend result: ${{ needs.type-check-frontend.result }}"
          exit 1

      - name: Report required type-check status
        run: echo type-check passed
