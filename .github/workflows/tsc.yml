name: TypeScript Syntax Check

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/tsc.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.jest.json"
      - "src/**"
      - "frontend/**"
      - "worker/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/tsc.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.jest.json"
      - "src/**"
      - "frontend/**"
      - "worker/**"
  workflow_dispatch:

jobs:
  backend-type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend TypeScript syntax check
        run: pnpm exec tsc --noEmit -p tsconfig.json

  frontend-type-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend TypeScript syntax check
        working-directory: frontend
        run: pnpm exec tsc --noEmit -p tsconfig.json

  frontend-docs-type-check:
    name: Frontend Docs Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/docs/pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend docs dependencies
        working-directory: frontend/docs
        run: pnpm install --frozen-lockfile

      - name: Run frontend docs TypeScript syntax check
        working-directory: frontend/docs
        run: pnpm exec tsc --noEmit -p tsconfig.json

  worker-type-check:
    name: Worker Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Run worker TypeScript syntax check
        working-directory: worker
        run: npx tsc --noEmit -p tsconfig.json
