name: Node and Rust Verification

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/tsc.yml"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/tsc.yml"
  workflow_dispatch:

jobs:
  node-verify:
    name: Node verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 使用明确的 v4 版本，避免可变分支引用

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 建议使用明确的 v4 版本
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Install dependencies
        # 仅做 TypeScript 编译检查，跳过构建脚本，避免 pnpm v10 在 CI 中因
        # 未批准的本地构建（bcrypt / @scarf/scarf / unrs-resolver 等）退出码 1
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run build
        run: pnpm run build

      - name: Run Jest tests
        run: pnpm run test --config jest.ci.config.js --ci --runInBand

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/
            dist-obfuscated/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Check for path-to-regexp issues
        run: |
          echo "Checking for potential path-to-regexp issues..."
          if grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"; then
            echo "Found routes with hyphens that might cause path-to-regexp issues:"
            grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"
            echo "Consider replacing hyphens with slashes in route paths"
          else
            echo "No routes with hyphens found"
          fi

  rust-verify:
    name: Rust verification
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 使用明确的 v4 版本，避免可变分支引用

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-services/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-services/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if cargo fetch --manifest-path rust-services/Cargo.toml --locked; then
              exit 0
            fi

            echo "Cargo fetch failed on attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 20))
          done

          cargo fetch --manifest-path rust-services/Cargo.toml --locked

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-services/Cargo.toml --all --check

      - name: Build Rust services
        run: cargo build --manifest-path rust-services/Cargo.toml --workspace --release --locked

      - name: Run Rust tests
        run: cargo test --manifest-path rust-services/Cargo.toml

      - name: Package Rust services
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          release_dir="rust-services/target/release"
          package_dir="rust-services-package"
          artifact_name="rust-services-${{ github.run_number }}-${{ github.run_attempt }}.tar.gz"
          binaries=(
            audio-worker
            data-tools
            file-worker
            network-tools
            security-worker
          )

          if [ ! -d "$release_dir" ]; then
            echo "No Rust release output found; skipping package."
            exit 0
          fi

          rm -rf "$package_dir" "$artifact_name"
          mkdir -p "$package_dir/bin"

          for binary in "${binaries[@]}"; do
            if [ ! -f "$release_dir/$binary" ]; then
              echo "Missing Rust binary: $release_dir/$binary" >&2
              exit 1
            fi

            cp "$release_dir/$binary" "$package_dir/bin/"
          done

          cp rust-services/Cargo.toml "$package_dir/"
          cp rust-services/Cargo.lock "$package_dir/"
          tar -czf "$artifact_name" -C "$package_dir" .

      - name: Upload Rust services artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-services-${{ github.run_number }}-${{ github.run_attempt }}
          path: rust-services-${{ github.run_number }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: warn
          retention-days: 7
