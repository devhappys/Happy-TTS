name: Node and Rust Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-verify:
    name: Node verification
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        # 跳过依赖安装脚本，避免未批准的本地构建
        # （bcrypt / @scarf/scarf / unrs-resolver 等）导致安装阶段退出。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit policy static checks
        run: pnpm run check:audit-policies

      - name: Run build
        run: pnpm run build

      - name: Run backend Jest tests with coverage
        id: backend-tests
        continue-on-error: true
        run: pnpm run test:ci

      - name: Run frontend Vitest tests with coverage
        id: frontend-tests
        continue-on-error: true
        run: pnpm --dir frontend run test:ci

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synapse-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/
            dist-obfuscated/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Check for path-to-regexp issues
        run: |
          echo "Checking for potential path-to-regexp issues..."
          if grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"; then
            echo "Found routes with hyphens that might cause path-to-regexp issues:"
            grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"
            echo "Consider replacing hyphens with slashes in route paths"
          else
            echo "No routes with hyphens found"
          fi

      - name: Enforce Node test results
        if: always()
        shell: bash
        run: |
          backend_outcome="${{ steps.backend-tests.outcome }}"
          frontend_outcome="${{ steps.frontend-tests.outcome }}"

          if [ "$backend_outcome" != "success" ] || [ "$frontend_outcome" != "success" ]; then
            echo "Backend tests: $backend_outcome"
            echo "Frontend tests: $frontend_outcome"
            exit 1
          fi

  rust-verify:
    name: Rust verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pin stable action + channel from rust-toolchain.toml
        with:
          toolchain: "1.89.0"
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-services/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-services/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if cargo fetch --manifest-path rust-services/Cargo.toml --locked; then
              exit 0
            fi

            echo "Cargo fetch failed on attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 20))
          done

          cargo fetch --manifest-path rust-services/Cargo.toml --locked

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-services/Cargo.toml --all --check

      - name: Build Rust services
        run: cargo build --manifest-path rust-services/Cargo.toml --workspace --release --locked

      - name: Run Rust tests
        run: cargo test --manifest-path rust-services/Cargo.toml

      - name: Package Rust services
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          release_dir="rust-services/target/release"
          package_dir="rust-services-package"
          artifact_name="rust-services-${{ github.run_number }}-${{ github.run_attempt }}.tar.gz"
          binaries=(
            audio-worker
            data-tools
            file-worker
            network-tools
            security-worker
          )

          if [ ! -d "$release_dir" ]; then
            echo "No Rust release output found; skipping package."
            exit 0
          fi

          rm -rf "$package_dir" "$artifact_name"
          mkdir -p "$package_dir/bin"

          for binary in "${binaries[@]}"; do
            if [ ! -f "$release_dir/$binary" ]; then
              echo "Missing Rust binary: $release_dir/$binary" >&2
              exit 1
            fi

            cp "$release_dir/$binary" "$package_dir/bin/"
          done

          cp rust-services/Cargo.toml "$package_dir/"
          cp rust-services/Cargo.lock "$package_dir/"
          tar -czf "$artifact_name" -C "$package_dir" .

      - name: Upload Rust services artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-services-${{ github.run_number }}-${{ github.run_attempt }}
          path: rust-services-${{ github.run_number }}-${{ github.run_attempt }}.tar.gz
          if-no-files-found: warn
          retention-days: 7

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    needs: [node-verify, rust-verify]
    steps:
      - name: Report required type-check status
        run: echo type-check passed
