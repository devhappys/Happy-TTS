name: TypeScript Compilation Check

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/tsc.yml"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/tsc.yml"
  workflow_dispatch:

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 建议使用明确的 v4 版本，避免 @main 的不稳定变更

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 建议使用明确的 v4 版本
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Install dependencies
        # 仅做 TypeScript 编译检查，跳过构建脚本，避免 pnpm v10 在 CI 中因
        # 未批准的本地构建（bcrypt / @scarf/scarf / unrs-resolver 等）退出码 1
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install global tools
        run: npm install -g javascript-obfuscator

      - name: Run build
        run: pnpm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/
            dist-obfuscated/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 7

      - name: Check for path-to-regexp issues
        run: |
          echo "Checking for potential path-to-regexp issues..."
          if grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"; then
            echo "Found routes with hyphens that might cause path-to-regexp issues:"
            grep -r "router\.(get|post|put|delete|patch).*-" src/routes/ --include="*.ts"
            echo "Consider replacing hyphens with slashes in route paths"
          else
            echo "No routes with hyphens found"
          fi
