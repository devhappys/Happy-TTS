name: Nightly Test Matrix

on:
  schedule:
    - cron: "0 16 * * *" # 00:00 Asia/Shanghai
  workflow_dispatch:

jobs:
  nightly-live:
    name: Nightly live / integration slice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Start MongoDB for live-ish suite
        shell: bash
        run: |
          docker run -d --name mongo-nightly -p 27017:27017 mongo:7
          for attempt in $(seq 1 30); do
            if docker exec mongo-nightly mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run nightly test matrix
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/synapse_nightly
          JWT_SECRET: nightly-test-jwt-secret
          ADMIN_PASSWORD: nightly-admin-password
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          IPFS_API_URL: ${{ secrets.IPFS_API_URL }}
          IPFS_GATEWAY_URL: ${{ secrets.IPFS_GATEWAY_URL }}
          YIYAN_API_KEY: ${{ secrets.YIYAN_API_KEY }}
          IP_QUERY_API_KEY: ${{ secrets.IP_QUERY_API_KEY }}
        run: pnpm run test:nightly

      - name: Upload Jest artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-logs
          path: |
            logs/**
            data/logs/**
          if-no-files-found: ignore
