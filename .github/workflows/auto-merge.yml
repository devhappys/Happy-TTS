name: Auto Merge After Required Checks

on:
  workflow_run:
    workflows:
      - "Node and Rust Verification"
      - "Docker"
      - "CodeQL"
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to merge after manual verification"
        required: true
        type: number
      head_sha:
        description: "Exact 40-character PR head SHA that was reviewed and checked"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate head SHA, required checks, and approvals before merge
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const script = require('./scripts/auto-merge.js');
            await script({ github, context, core });
