name: "CodeQL"

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/**
      - "!.github/workflows/codeql.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0" # 每周日凌晨自动扫描
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript", "typescript", "python", "rust"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        if: matrix.language != 'rust'
        uses: github/codeql-action/autobuild@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
      - name: Cache Cargo dependencies
        if: matrix.language == 'rust'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-services/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-services/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pin stable action + channel from rust-toolchain.toml
        with:
          toolchain: "1.89.0"
      - name: Fetch Rust dependencies
        if: matrix.language == 'rust'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if cargo fetch --locked; then
              exit 0
            fi

            echo "Cargo fetch failed on attempt ${attempt}; retrying..." >&2
            sleep $((attempt * 20))
          done

          cargo fetch --locked
        working-directory: rust-services
      - name: Build Rust workspace
        if: matrix.language == 'rust'
        run: cargo build --workspace --locked
        working-directory: rust-services
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ddf5ce7296213f5548c91e2dd19df2d77d2b2d66 # v3
        with:
          category: "/language:${{ matrix.language }}"
