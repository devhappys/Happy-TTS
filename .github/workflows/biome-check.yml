name: Biome Check

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  biome-safe:
    name: Safe Fixes (create PR for review)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Biome safe fixes
        run: pnpm exec biome check --write --max-diagnostics=9999 ./src || true

      - name: Check for changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify TypeScript compilation
        if: steps.diff.outputs.has_changes == 'true'
        id: tsc
        run: |
          TSC_OUTPUT=$(pnpm exec tsc --noEmit 2>&1 || true)
          FILTERED=$(echo "$TSC_OUTPUT" | grep -v "error TS2578" || true)
          REAL_ERRORS=$(echo "$FILTERED" | grep " error TS" || true)
          if [ -z "$REAL_ERRORS" ]; then
            echo "tsc_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "$FILTERED"
            echo "tsc_pass=false" >> "$GITHUB_OUTPUT"
            echo "::error::TypeScript compilation failed after safe fixes, aborting PR creation"
          fi

      - name: Create PR if changes exist
        if: steps.diff.outputs.has_changes == 'true' && steps.tsc.outputs.tsc_pass == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="biome/safe-fixes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git commit -m "style: apply biome safe fixes"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "style: biome safe fixes" \
            --body "This PR contains safe auto-fixes from Biome. TypeScript compilation passed in this workflow."
        env:
          GH_TOKEN: ${{ github.token }}

  biome-unsafe:
    name: Unsafe Fixes (create PR for review)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Biome unsafe fixes
        run: pnpm exec biome check --write --unsafe --max-diagnostics=9999 ./src || true

      - name: Check for changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify TypeScript compilation
        if: steps.diff.outputs.has_changes == 'true'
        id: tsc
        run: |
          TSC_OUTPUT=$(pnpm exec tsc --noEmit 2>&1 || true)
          FILTERED=$(echo "$TSC_OUTPUT" | grep -v "error TS2578" || true)
          REAL_ERRORS=$(echo "$FILTERED" | grep " error TS" || true)
          if [ -z "$REAL_ERRORS" ]; then
            echo "tsc_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "$FILTERED"
            echo "tsc_pass=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TypeScript compilation has errors; PR will still be created for review"
          fi

      - name: Create PR if changes exist
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="biome/unsafe-fixes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git commit -m "style: apply biome unsafe fixes"
          git push origin "$BRANCH"

          if [ "${{ steps.tsc.outputs.tsc_pass }}" = "true" ]; then
            TSC_STATUS="TypeScript compilation passed."
          else
            TSC_STATUS="TypeScript compilation reported errors. Review and fix this branch before merging."
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "style: biome unsafe fixes" \
            --body "This PR contains unsafe auto-fixes from Biome.

          These changes may alter runtime behavior and require review.

          ${TSC_STATUS}"
        env:
          GH_TOKEN: ${{ github.token }}
