version: "3.8"

services:
  app:
    image: happyclo/tts-node:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - USER_STORAGE_MODE=mongo
      - MONGO_URI=${MONGO_URI}
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_DB=${MONGO_DB:-tts}
      - MONGO_PROXY_URL=${MONGO_PROXY_URL}
      - RUST_NETWORK_TOOLS_ENABLED=${RUST_NETWORK_TOOLS_ENABLED:-true}
      - RUST_EMBEDDED_SERVICES_ENABLED=${RUST_EMBEDDED_SERVICES_ENABLED:-true}
      - RUST_NETWORK_TOOLS_URL=${RUST_NETWORK_TOOLS_URL:-http://127.0.0.1:4010}
      - RUST_NETWORK_TOOLS_TIMEOUT_MS=${RUST_NETWORK_TOOLS_TIMEOUT_MS:-5000}
      - RUST_NETWORK_TOOLS_FALLBACK_ENABLED=${RUST_NETWORK_TOOLS_FALLBACK_ENABLED:-true}
      - RUST_NETWORK_TOOLS_BLOCK_PRIVATE_TARGETS=${RUST_NETWORK_TOOLS_BLOCK_PRIVATE_TARGETS:-true}
      - RUST_AUDIO_WORKER_ENABLED=${RUST_AUDIO_WORKER_ENABLED:-true}
      - RUST_AUDIO_WORKER_URL=${RUST_AUDIO_WORKER_URL:-http://127.0.0.1:4020}
      - RUST_AUDIO_WORKER_TIMEOUT_MS=${RUST_AUDIO_WORKER_TIMEOUT_MS:-30000}
      - RUST_AUDIO_WORKER_MAX_BYTES=${RUST_AUDIO_WORKER_MAX_BYTES:-20971520}
      - RUST_AUDIO_WORKER_OPERATIONS=${RUST_AUDIO_WORKER_OPERATIONS:-passthrough,analyze}
      - RUST_AUDIO_WORKER_FALLBACK_ENABLED=${RUST_AUDIO_WORKER_FALLBACK_ENABLED:-true}
      - RUST_FILE_WORKER_ENABLED=${RUST_FILE_WORKER_ENABLED:-true}
      - RUST_FILE_WORKER_URL=${RUST_FILE_WORKER_URL:-http://127.0.0.1:4030}
      - RUST_FILE_WORKER_TIMEOUT_MS=${RUST_FILE_WORKER_TIMEOUT_MS:-30000}
      - RUST_FILE_WORKER_MAX_BYTES=${RUST_FILE_WORKER_MAX_BYTES:-52428800}
      - RUST_FILE_WORKER_FALLBACK_ENABLED=${RUST_FILE_WORKER_FALLBACK_ENABLED:-true}
      - RUST_DATA_TOOLS_ENABLED=${RUST_DATA_TOOLS_ENABLED:-true}
      - RUST_DATA_TOOLS_URL=${RUST_DATA_TOOLS_URL:-http://127.0.0.1:4040}
      - RUST_DATA_TOOLS_TIMEOUT_MS=${RUST_DATA_TOOLS_TIMEOUT_MS:-30000}
      - RUST_DATA_TOOLS_MAX_BYTES=${RUST_DATA_TOOLS_MAX_BYTES:-20971520}
      - RUST_DATA_TOOLS_MAX_ITEMS=${RUST_DATA_TOOLS_MAX_ITEMS:-1024}
      - RUST_DATA_TOOLS_FALLBACK_ENABLED=${RUST_DATA_TOOLS_FALLBACK_ENABLED:-true}
      - RUST_SECURITY_WORKER_ENABLED=${RUST_SECURITY_WORKER_ENABLED:-true}
      - RUST_SECURITY_WORKER_URL=${RUST_SECURITY_WORKER_URL:-http://127.0.0.1:4050}
      - RUST_SECURITY_WORKER_TIMEOUT_MS=${RUST_SECURITY_WORKER_TIMEOUT_MS:-5000}
      - RUST_SECURITY_WORKER_MAX_TEXT_BYTES=${RUST_SECURITY_WORKER_MAX_TEXT_BYTES:-2097152}
      - RUST_SECURITY_WORKER_MAX_RULES=${RUST_SECURITY_WORKER_MAX_RULES:-2048}
      - RUST_SECURITY_WORKER_FALLBACK_ENABLED=${RUST_SECURITY_WORKER_FALLBACK_ENABLED:-true}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  network-tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-network-tools-runtime
    profiles:
      - rust-sidecars
    expose:
      - "4010"
    environment:
      - RUST_BIND_ADDR=0.0.0.0:4010
      - RUST_NETWORK_TOOLS_BLOCK_PRIVATE_TARGETS=${RUST_NETWORK_TOOLS_BLOCK_PRIVATE_TARGETS:-true}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    restart: unless-stopped

  audio-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-audio-worker-runtime
    profiles:
      - rust-sidecars
    expose:
      - "4020"
    environment:
      - RUST_AUDIO_WORKER_BIND_ADDR=0.0.0.0:4020
      - RUST_AUDIO_WORKER_MAX_BYTES=${RUST_AUDIO_WORKER_MAX_BYTES:-20971520}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    restart: unless-stopped

  file-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-file-worker-runtime
    profiles:
      - rust-sidecars
    expose:
      - "4030"
    environment:
      - RUST_FILE_WORKER_BIND_ADDR=0.0.0.0:4030
      - RUST_FILE_WORKER_MAX_BYTES=${RUST_FILE_WORKER_MAX_BYTES:-52428800}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    restart: unless-stopped

  data-tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-data-tools-runtime
    profiles:
      - rust-sidecars
    expose:
      - "4040"
    environment:
      - RUST_DATA_TOOLS_BIND_ADDR=0.0.0.0:4040
      - RUST_DATA_TOOLS_MAX_BYTES=${RUST_DATA_TOOLS_MAX_BYTES:-20971520}
      - RUST_DATA_TOOLS_MAX_ITEMS=${RUST_DATA_TOOLS_MAX_ITEMS:-1024}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    restart: unless-stopped

  security-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-security-worker-runtime
    profiles:
      - rust-sidecars
    expose:
      - "4050"
    environment:
      - RUST_SECURITY_WORKER_BIND_ADDR=0.0.0.0:4050
      - RUST_SECURITY_WORKER_MAX_TEXT_BYTES=${RUST_SECURITY_WORKER_MAX_TEXT_BYTES:-2097152}
      - RUST_SECURITY_WORKER_MAX_RULES=${RUST_SECURITY_WORKER_MAX_RULES:-2048}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
    restart: unless-stopped

networks:
  default:
    enable_ipv6: true

volumes:
  static:
