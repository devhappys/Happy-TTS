<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
  <tr>
    <td style="padding:0 0 8px 0;">
      <span style="display:inline-block;padding:6px 12px;background-color:#D3E3FD;border-radius:18px;font-size:14px;line-height:20px;font-weight:500;color:#041E49;">{{username}}</span>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 0 0 0;">
      <h1 style="margin:0;font-size:24px;line-height:32px;font-weight:500;color:#1F1F1F;">密码重置成功</h1>
    </td>
  </tr>  <tr>
    <td style="padding:16px 0 0 0;font-size:16px;line-height:24px;font-weight:400;color:#3C4043;">你的 Synapse 账号密码已于 <strong style="color:#1F1F1F;">{{changeTime}}</strong> 通过验证码方式成功重置。</td>
  </tr>  <tr>
    <td style="padding:24px 0 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:separate;border:1px solid #DADCE0;border-radius:8px;overflow:hidden;">
        <tr>
          <td width="38%" style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;color:#5F6368;vertical-align:top;">IP 地址</td>
          <td style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;font-weight:500;color:#1F1F1F;vertical-align:top;word-break:break-word;">{{ipAddress}}</td>
        </tr>
        <tr>
          <td width="38%" style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;color:#5F6368;vertical-align:top;">设备名称</td>
          <td style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;font-weight:500;color:#1F1F1F;vertical-align:top;word-break:break-word;">{{deviceName}}</td>
        </tr>
        <tr>
          <td width="38%" style="padding:14px 16px;font-size:14px;line-height:20px;color:#5F6368;vertical-align:top;">设备指纹</td>
          <td style="padding:14px 16px;font-size:14px;line-height:20px;font-weight:500;color:#1F1F1F;vertical-align:top;word-break:break-word;"><span style="font-family:Consolas,'Courier New',monospace;">{{fingerprint}}</span></td>
        </tr>
      </table>
    </td>
  </tr>
  {{adminNotice}}  <tr>
    <td style="padding:24px 0 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:separate;background-color:#D3E3FD;border-radius:8px;">
        <tr>
          <td style="padding:14px 16px;font-size:14px;line-height:20px;color:#041E49;">如果这是你本人进行的操作，则无需采取任何行动。如果你不认识此活动，请立即再次重置密码并检查账号安全设置。</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
