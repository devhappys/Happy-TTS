<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
  <tr>
    <td style="padding:0 0 8px 0;">
      <span style="display:inline-block;padding:6px 12px;background-color:#D3E3FD;border-radius:18px;font-size:14px;line-height:20px;font-weight:500;color:#041E49;">{{username}}</span>
    </td>
  </tr>
  <tr>
    <td style="padding:16px 0 0 0;">
      <h1 style="margin:0;font-size:24px;line-height:32px;font-weight:500;color:#1F1F1F;">{{title}}</h1>
    </td>
  </tr>  <tr>
    <td style="padding:16px 0 0 0;font-size:16px;line-height:24px;font-weight:400;color:#3C4043;">{{description}}</td>
  </tr>  <tr>
    <td style="padding:24px 0 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:separate;border:1px solid #DADCE0;border-radius:8px;overflow:hidden;">
        <tr>
          <td width="38%" style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;color:#5F6368;vertical-align:top;">操作时间</td>
          <td style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;font-weight:500;color:#1F1F1F;vertical-align:top;word-break:break-word;">{{time}}</td>
        </tr>
        <tr>
          <td width="38%" style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;color:#5F6368;vertical-align:top;">IP 地址</td>
          <td style="padding:14px 16px;border-bottom:1px solid #DADCE0;font-size:14px;line-height:20px;font-weight:500;color:#1F1F1F;vertical-align:top;word-break:break-word;">{{ip}}</td>
        </tr>
        <tr>
          <td width="38%" style="padding:14px 16px;font-size:14px;line-height:20px;color:#5F6368;vertical-align:top;">设备/环境</td>
          <td style="padding:14px 16px;font-size:14px;line-height:20px;font-weight:500;color:#1F1F1F;vertical-align:top;word-break:break-word;">{{device}}</td>
        </tr>
      </table>
    </td>
  </tr>  <tr>
    <td style="padding:24px 0 0 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:separate;background-color:#D3E3FD;border-radius:8px;">
        <tr>
          <td style="padding:14px 16px;font-size:14px;line-height:20px;color:#041E49;">{{warning}}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
