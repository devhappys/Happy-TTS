<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="email=no" />
  <meta name="format-detection" content="date=no" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{pageTitle}}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#F8FAFD;color:#1F1F1F;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;background-color:#F8FAFD;">
    <tr>
      <td align="center" style="padding:24px 12px 32px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border-collapse:separate;">
          <tr>
            <td style="padding:0 8px 16px 8px;font-family:Roboto,Arial,Helvetica,sans-serif;">
              <span style="font-size:20px;line-height:28px;font-weight:600;color:#041E49;">Synapse</span>
            </td>
          </tr>
          <tr>
            <td style="background-color:#FFFFFF;border:1px solid #DADCE0;border-radius:12px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
                <tr>
                  <td style="padding:32px;font-family:Roboto,Arial,Helvetica,sans-serif;">
                    {{content}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 24px 0 24px;font-family:Roboto,Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;font-weight:400;color:#5F6368;">
              <div style="margin:0 0 8px 0;">本邮件由系统自动发送，请勿直接回复。</div>
              <div style="margin:0 0 4px 0;">Synapse · 让文字拥有声音</div>
              <div>&copy; 2026 Synapse</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
