<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="email=no" />
    <title>Synapse 账号密码凭据</title>
    <style>
        @media screen and (min-width: 600px) {
            .card {
                padding: 40px 40px !important;
            }
        }
    </style>
</head>

<body style="margin: 0; padding: 0;" bgcolor="#FFFFFF">
    <table width="100%" height="100%" style="min-width: 348px;" border="0" cellspacing="0" cellpadding="0">
        <tr height="32">
            <td></td>
        </tr>
        <tr align="center">
            <td>
                <table border="0" cellspacing="0" cellpadding="0" style="padding-bottom: 20px; max-width: 516px; min-width: 220px;">
                    <tr>
                        <td width="8"></td>
                        <td>
                            <div style="border: 1px solid #dadce0; border-radius: 8px; padding: 40px 20px;" align="center" class="card">
                                <img src="https://img.cdn1.vip/i/6a151e1365e9c_1779768851.webp" width="44" height="44" alt="Logo" style="display: inline-block; border-radius: 50%; margin-bottom: 16px;" />
                                <div style="font-family: 'Google Sans', Roboto, RobotoDraft, Helvetica, Arial, sans-serif; border-bottom: 1px solid #dadce0; color: rgba(0,0,0,0.87); line-height: 32px; padding-bottom: 24px; text-align: center; word-break: break-word;">
                                    <div style="font-size: 24px;">账号密码凭据</div>
                                    <div style="font-size: 14px; margin-top: 8px;">尊敬的 {{username}}：</div>
                                </div>

                                <div style="font-family: Roboto-Regular, Helvetica, Arial, sans-serif; font-size: 14px; color: rgba(0,0,0,0.87); line-height: 20px; padding-top: 20px; text-align: left;">
                                    <p>您已通过 {{providerLabel}} 完成 Synapse 账号注册。系统已为您的本地账号自动生成登录密码。</p>
                                    <table width="100%" cellspacing="0" cellpadding="0" style="margin: 16px 0; border: 1px solid #e8eaed; border-radius: 8px; overflow: hidden;">
                                        <tr style="background-color: #f8f9fa;">
                                            <td style="padding: 10px 16px; font-size: 13px; color: #5f6368; border-bottom: 1px solid #e8eaed; width: 92px;">用户名</td>
                                            <td style="padding: 10px 16px; font-size: 13px; color: rgba(0,0,0,0.87); border-bottom: 1px solid #e8eaed; font-weight: 600;">{{username}}</td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 10px 16px; font-size: 13px; color: #5f6368;">系统密码</td>
                                            <td style="padding: 10px 16px; font-size: 14px; color: rgba(0,0,0,0.87); font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 1px; word-break: break-all;">{{password}}</td>
                                        </tr>
                                    </table>
                                    <div style="padding: 14px 16px; background-color: #fce8e6; border: 1px solid #d93025; border-radius: 8px;">
                                        <p style="margin: 0; color: #d93025; font-size: 13px; font-weight: 600;">请在登录后及时修改密码，并不要将此密码分享给任何人。</p>
                                    </div>
                                </div>

                                <div style="padding-top: 20px; font-size: 12px; line-height: 16px; color: #5f6368; text-align: center;">
                                    本邮件由系统自动发出，请勿直接回复。
                                </div>
                            </div>
                            <div style="text-align: center; font-family: Roboto-Regular, Helvetica, Arial, sans-serif; color: rgba(0,0,0,0.54); font-size: 11px; line-height: 18px; padding-top: 12px;">
                                <div>Synapse 团队 · 致力于让文字拥有声音的力量</div>
                                <div>&copy; 2026 Synapse</div>
                            </div>
                        </td>
                        <td width="8"></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr height="32">
            <td></td>
        </tr>
    </table>
</body>

</html>
