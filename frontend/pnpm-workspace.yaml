overrides:
  marked: $marked
  react: $react
  react-dom: $react-dom
  lodash-es: '>=4.18.1'
  minimatch: '>=10.2.1'
  dompurify: $dompurify
  lodash: '>=4.18.0'
  esbuild: '>=0.28.1'
  undici: '>=8.9.0'
  js-yaml: '>=5.2.2'
  fast-uri: '>=3.1.5'
  brace-expansion: '>=5.0.9'

peerDependencyRules:
  allowedVersions:
    react: '19'
    react-dom: '19'
    marked: '17'

allowBuilds:
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  esbuild: true
  tree-sitter: true
  tree-sitter-json: true
