[package]
name = "security-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.11.0"
axum = "0.8.9"
base64 = "0.22.1"
hmac = "0.13.0"
ipc-runtime = { path = "../ipc-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
